server:
  port: 8081

spring:
  application:
    name: ms-campuslab-bookings

  datasource:
    url: jdbc:mysql://localhost:3306/bookings_db?createDatabaseIfNotExist=true
    username: root
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_TENANT_ID:aff2eb38-d6cf-4220-8527-53f1cb6aed15}/v2.0
          # El BFF reenvía el token del usuario, emitido para la API ms-campuslab-bff
          audiences:
            - 8d19bb45-1842-43ce-b76c-4513b979df81
            - api://8d19bb45-1842-43ce-b76c-4513b979df81

audit:
  service:
    url: http://localhost:8085